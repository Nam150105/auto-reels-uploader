<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Hệ Thống Quản Lý Fanpage & Reels Scheduler</title>
  <meta property="fb:app_id" content="1469615908436980" />
  <meta property="og:url" content="https://pagefb.namnangno.click/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Quản lý fanpage" />
  <meta property="og:title" content="Quản lý fanpage - Hệ Thống Quản Lý Fanpage & Reels Scheduler" />
  <meta property="og:description" content="Hệ thống quản lý Fanpage đa tài khoản và hẹn lịch đăng Facebook Reels tự động qua Meta Graph API." />
  <script data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 Production CDN (jsDelivr chuẩn, fallback sang unpkg qua DOM script) -->
  <script data-cfasync="false" src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js" onerror="(function(){var s=document.createElement('script');s.src='https://unpkg.com/vue@3/dist/vue.global.prod.js';document.head.appendChild(s);})()"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    [v-cloak] { display: none !important; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 select-none">

  <div id="app" v-cloak class="w-full max-w-md">
    
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex h-14 w-14 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-pink-500 items-center justify-center shadow-xl shadow-indigo-500/25 text-white font-extrabold text-2xl mb-3">
        R
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">Quản Lý Fanpage &amp; Reels</h1>
      <p class="text-xs text-slate-400 mt-1">Đăng nhập tài khoản hệ thống để bắt đầu kết nối Facebook</p>
    </div>

    <!-- Auth Card -->
    <div v-if="authState === 'checking'" class="bg-slate-900/95 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-xl p-8 text-center">
      <div class="w-10 h-10 rounded-full bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center mx-auto mb-3">
        <svg class="animate-spin h-5 w-5 text-indigo-400" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </div>
      <p class="text-xs text-slate-300 font-semibold">Đang kiểm tra phiên đăng nhập...</p>
    </div>

    <div v-else class="bg-slate-900/95 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-xl p-7 sm:p-8">
      
      <!-- Tab Switcher -->
      <div class="flex p-1 bg-slate-950 rounded-xl mb-6 border border-slate-800/80">
        <button 
          @click="activeTab = 'login'; errorMsg = ''; successMsg = ''"
          :class="activeTab === 'login' ? 'bg-indigo-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-white'"
          class="flex-1 py-2 text-xs rounded-lg transition-all text-center">
          Đăng Nhập
        </button>
        <button 
          @click="activeTab = 'register'; errorMsg = ''; successMsg = ''"
          :class="activeTab === 'register' ? 'bg-indigo-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-white'"
          class="flex-1 py-2 text-xs rounded-lg transition-all text-center">
          Đăng Ký Tài Khoản
        </button>
      </div>

      <!-- Alerts -->
      <div v-if="errorMsg" class="mb-5 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-start gap-2">
        <span class="font-bold shrink-0">✕</span>
        <span>{{ errorMsg }}</span>
      </div>

      <div v-if="successMsg" class="mb-5 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs flex items-start gap-2">
        <span class="font-bold shrink-0">✓</span>
        <span>{{ successMsg }}</span>
      </div>

      <!-- FORM 1: LOGIN -->
      <form v-if="activeTab === 'login'" @submit.prevent="handleLogin" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Tên đăng nhập</label>
          <input 
            v-model="loginForm.username" 
            type="text" 
            required 
            placeholder="username" 
            autocomplete="username"
            class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Mật khẩu</label>
          <input 
            v-model="loginForm.password" 
            type="password" 
            required 
            placeholder="••••••••" 
            autocomplete="current-password"
            class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <button 
          type="submit" 
          :disabled="loading" 
          class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-indigo-500/25 transition disabled:opacity-50">
          <span v-if="loading">Đang xác thực...</span>
          <span v-else>Đăng Nhập Vào Hệ Thống</span>
        </button>
      </form>

      <!-- FORM 2: REGISTER -->
      <form v-if="activeTab === 'register'" @submit.prevent="handleRegister" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Họ và tên</label>
          <input 
            v-model="regForm.full_name" 
            type="text" 
            placeholder="Ví dụ: Nguyễn Văn A" 
            class="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Email liên hệ</label>
          <input 
            v-model="regForm.email" 
            type="email" 
            placeholder="email@vidu.com" 
            class="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tên đăng nhập <span class="text-rose-400">*</span></label>
          <input 
            v-model="regForm.username" 
            type="text" 
            required 
            placeholder="Tối thiểu 3 ký tự (chữ hoặc số)" 
            autocomplete="username"
            class="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Mật khẩu <span class="text-rose-400">*</span></label>
          <input 
            v-model="regForm.password" 
            type="password" 
            required 
            placeholder="Tối thiểu 4 ký tự" 
            autocomplete="new-password"
            class="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Xác nhận mật khẩu <span class="text-rose-400">*</span></label>
          <input 
            v-model="regForm.confirm_password" 
            type="password" 
            required 
            placeholder="Nhập lại mật khẩu" 
            autocomplete="new-password"
            class="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <button 
          type="submit" 
          :disabled="loading" 
          class="w-full py-2.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-teal-500/25 transition disabled:opacity-50 mt-2">
          <span v-if="loading">Đang đăng ký...</span>
          <span v-else>Tạo Tài Khoản Mới</span>
        </button>
      </form>

    </div>

    <!-- Public Links Footer -->
    <div class="mt-8 text-center text-xs text-slate-500 flex justify-center gap-4 flex-wrap">
      <a href="/privacy" target="_blank" class="hover:text-slate-300 transition">Chính sách quyền riêng tư</a>
      <span>•</span>
      <a href="/terms" target="_blank" class="hover:text-slate-300 transition">Điều khoản dịch vụ</a>
      <span>•</span>
      <a href="/data-deletion" target="_blank" class="hover:text-slate-300 transition">Xóa dữ liệu</a>
    </div>

  </div>

  <script data-cfasync="false">
    function initLoginApp() {
      if (typeof Vue === 'undefined') {
        setTimeout(initLoginApp, 50);
        return;
      }
      const { createApp, ref, onMounted, onUnmounted } = Vue;

      function getSafeRedirectTarget() {
        try {
          const params = new URLSearchParams(window.location.search);
          const raw = (params.get('redirect') || '').trim();
          if (
            raw &&
            raw.startsWith('/') &&
            !raw.startsWith('//') &&
            !raw.startsWith('/login') &&
            !raw.startsWith('/api/')
          ) {
            if (raw === '/' || raw === '/pages') return '/page';
            if (raw.startsWith('/pages?')) return '/page' + raw.slice(6);
            return raw;
          }
        } catch (e) {}
        return '/page';
      }

      function saveAuthBootstrap(user, csrfToken) {
        try {
          sessionStorage.setItem(
            'fb_reels_auth_bootstrap',
            JSON.stringify({
              user: user || null,
              csrf_token: csrfToken || null,
              ts: Date.now()
            })
          );
          localStorage.setItem(
            'fb_reels_auth_event',
            JSON.stringify({
              event: 'login',
              userId: user && user.id ? user.id : null,
              ts: Date.now()
            })
          );
        } catch (e) {}
      }

      createApp({
      setup() {
        const authState = ref('unauthenticated'); // 'checking' | 'authenticated' | 'unauthenticated'
        const activeTab = ref('login');
        const loading = ref(false);
        const errorMsg = ref('');
        const successMsg = ref('');

        const loginForm = ref({
          username: '',
          password: ''
        });

        const regForm = ref({
          full_name: '',
          email: '',
          username: '',
          password: '',
          confirm_password: ''
        });

        async function verifyExistingSession() {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 6000);
          try {
            const resp = await fetch('/api/auth/me', {
              method: 'GET',
              credentials: 'same-origin',
              cache: 'no-store',
              signal: controller.signal
            });
            if (resp.ok) {
              const data = await resp.json();
              if (data && data.authenticated && data.user) {
                authState.value = 'authenticated';
                saveAuthBootstrap(data.user, data.csrf_token);
                window.location.replace(getSafeRedirectTarget());
                return true;
              }
            }
          } catch (e) {
            // Giữ trạng thái hiển thị form đăng nhập nếu chưa đăng nhập hoặc lỗi mạng
          } finally {
            clearTimeout(timer);
          }
          authState.value = 'unauthenticated';
          return false;
        }

        function onPageShow(event) {
          if (event && event.persisted) {
            authState.value = 'checking';
            verifyExistingSession();
          }
        }

        function onStorageEvent(event) {
          if (event && event.key === 'fb_reels_auth_event' && event.newValue) {
            try {
              const parsed = JSON.parse(event.newValue);
              if (parsed && parsed.event === 'login') {
                verifyExistingSession();
              }
            } catch (e) {}
          }
        }

        onMounted(() => {
          verifyExistingSession();
          window.addEventListener('pageshow', onPageShow);
          window.addEventListener('storage', onStorageEvent);
        });

        onUnmounted(() => {
          window.removeEventListener('pageshow', onPageShow);
          window.removeEventListener('storage', onStorageEvent);
        });

        const handleLogin = async () => {
          if (loading.value) return;
          errorMsg.value = '';
          successMsg.value = '';
          loading.value = true;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 12000);
          try {
            const resp = await fetch('/api/auth/login', {
              method: 'POST',
              credentials: 'same-origin',
              cache: 'no-store',
              signal: controller.signal,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: loginForm.value.username.trim(),
                password: loginForm.value.password
              })
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
              throw new Error(data.detail || data.message || 'Đăng nhập không thành công.');
            }
            authState.value = 'authenticated';
            saveAuthBootstrap(data.user, data.csrf_token);
            successMsg.value = 'Đăng nhập thành công! Đang chuyển đến trang quản lý...';
            window.location.replace(getSafeRedirectTarget());
          } catch (err) {
            if (err && err.name === 'AbortError') {
              errorMsg.value = 'Máy chủ phản hồi quá thời gian chờ. Vui lòng thử lại.';
            } else {
              errorMsg.value = err.message || 'Lỗi kết nối máy chủ.';
            }
          } finally {
            clearTimeout(timer);
            loading.value = false;
          }
        };

        const handleRegister = async () => {
          if (loading.value) return;
          errorMsg.value = '';
          successMsg.value = '';
          if (regForm.value.password !== regForm.value.confirm_password) {
            errorMsg.value = 'Mật khẩu xác nhận không khớp!';
            return;
          }
          loading.value = true;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 12000);
          try {
            const resp = await fetch('/api/auth/register', {
              method: 'POST',
              credentials: 'same-origin',
              cache: 'no-store',
              signal: controller.signal,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: regForm.value.username.trim(),
                password: regForm.value.password,
                full_name: regForm.value.full_name.trim(),
                email: regForm.value.email.trim()
              })
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
              throw new Error(data.detail || data.message || 'Đăng ký không thành công.');
            }
            authState.value = 'authenticated';
            saveAuthBootstrap(data.user, data.csrf_token);
            successMsg.value = 'Tạo tài khoản thành công! Đang chuyển đến trang quản lý...';
            window.location.replace(getSafeRedirectTarget());
          } catch (err) {
            if (err && err.name === 'AbortError') {
              errorMsg.value = 'Máy chủ phản hồi quá thời gian chờ. Vui lòng thử lại.';
            } else {
              errorMsg.value = err.message || 'Lỗi khi đăng ký tài khoản.';
            }
          } finally {
            clearTimeout(timer);
            loading.value = false;
          }
        };

        return {
          authState,
          activeTab,
          loading,
          errorMsg,
          successMsg,
          loginForm,
          regForm,
          handleLogin,
          handleRegister
        };
      }
    }).mount('#app');
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLoginApp);
    } else {
      initLoginApp();
    }
  </script>
</body>
</html>
