<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#f8fafc] text-slate-800">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NNN REELS FB - Quản Lý Fanpage &amp; Reels Scheduler</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta property="fb:app_id" content="1469615908436980" />
  <meta property="og:url" content="https://pagefb.namnangno.click/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Quản lý fanpage" />
  <meta property="og:title" content="NNN REELS FB - Hệ Thống Quản Lý Fanpage & Reels Scheduler" />
  <meta property="og:description" content="Hệ thống quản lý Fanpage đa tài khoản và hẹn lịch đăng Facebook Reels tự động qua Meta Graph API." />
  <script data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 Production CDN (jsDelivr chuẩn, fallback sang unpkg qua DOM script) -->
  <script data-cfasync="false" src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js" onerror="(function(){var s=document.createElement('script');s.src='https://unpkg.com/vue@3/dist/vue.global.prod.js';document.head.appendChild(s);})()"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Be Vietnam Pro', 'Plus Jakarta Sans', system-ui, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    [v-cloak] { display: none !important; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-50 via-blue-50/25 to-indigo-50/35 select-none text-slate-800">

  <div id="app" v-cloak class="w-full max-w-md">
    
    <!-- Brand Header -->
    <div class="text-center mb-7">
      <div class="inline-flex h-16 w-16 rounded-2xl bg-gradient-to-tr from-blue-500 via-indigo-500 to-pink-500 items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-black text-xl mb-3 tracking-tighter">
        NNN
      </div>
      <div class="flex items-center justify-center gap-2 mb-1">
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">NNN REELS FB</h1>
        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200/80">PRO</span>
      </div>
      <p class="text-xs text-slate-500 font-medium">Quản lý Fanpage &amp; Lên Lịch Đăng Bài Tự Động</p>
    </div>

    <!-- Auth Card -->
    <div v-if="authState === 'checking'" class="bg-white/95 border border-slate-200/90 rounded-3xl shadow-xl shadow-slate-200/50 backdrop-blur-xl p-8 text-center">
      <div class="w-10 h-10 rounded-full bg-blue-50 border border-blue-200 flex items-center justify-center mx-auto mb-3">
        <svg class="animate-spin h-5 w-5 text-blue-600" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </div>
      <p class="text-xs text-slate-600 font-semibold">Đang kiểm tra phiên đăng nhập...</p>
    </div>

    <div v-else class="bg-white/95 border border-slate-200/90 rounded-3xl shadow-xl shadow-slate-200/50 backdrop-blur-xl p-7 sm:p-8">
      
      <h1 class="text-base font-black text-slate-800 text-center mb-6">Đăng Nhập</h1>

      <!-- Alerts -->
      <div v-if="errorMsg" class="mb-5 p-3 rounded-xl bg-rose-50 border border-rose-200/90 text-rose-700 text-xs flex items-start gap-2 shadow-2xs">
        <span class="font-bold shrink-0">✕</span>
        <span>{{ errorMsg }}</span>
      </div>

      <div v-if="successMsg" class="mb-5 p-3 rounded-xl bg-emerald-50 border border-emerald-200/90 text-emerald-700 text-xs flex items-start gap-2 shadow-2xs">
        <span class="font-bold shrink-0">✓</span>
        <span>{{ successMsg }}</span>
      </div>

      <!-- FORM 1: LOGIN -->
      <form v-if="activeTab === 'login'" @submit.prevent="handleLogin" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Tên đăng nhập</label>
          <input 
            v-model="loginForm.username" 
            type="text" 
            required 
            placeholder="username" 
            autocomplete="username"
            class="w-full px-3.5 py-2.5 bg-slate-50/80 border border-slate-200/90 rounded-xl text-slate-800 text-xs focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 transition placeholder:text-slate-400">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Mật khẩu</label>
          <input 
            v-model="loginForm.password" 
            type="password" 
            required 
            placeholder="••••••••" 
            autocomplete="current-password"
            class="w-full px-3.5 py-2.5 bg-slate-50/80 border border-slate-200/90 rounded-xl text-slate-800 text-xs focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 transition placeholder:text-slate-400">
        </div>

        <button 
          type="submit" 
          :disabled="loading" 
          class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-bold rounded-xl shadow-md shadow-blue-500/20 transition disabled:opacity-50">
          <span v-if="loading">Đang xác thực...</span>
          <span v-else>Đăng Nhập Vào Hệ Thống</span>
        </button>
      </form>

      <p class="mt-5 text-center text-[11px] text-slate-500">Chưa có tài khoản? Liên hệ quản trị viên để được cấp tài khoản.</p>

    </div>

    <!-- Public Links Footer -->
    <div class="mt-7 text-center text-xs text-slate-500 flex justify-center gap-4 flex-wrap font-medium">
      <a href="/privacy" target="_blank" class="hover:text-slate-700 transition">Chính sách quyền riêng tư</a>
      <span>•</span>
      <a href="/terms" target="_blank" class="hover:text-slate-700 transition">Điều khoản dịch vụ</a>
      <span>•</span>
      <a href="/data-deletion" target="_blank" class="hover:text-slate-700 transition">Xóa dữ liệu</a>
    </div>

  </div>

  <script data-cfasync="false">
    function initLoginApp() {
      if (typeof Vue === 'undefined') {
        setTimeout(initLoginApp, 50);
        return;
      }
      const { createApp, ref, onMounted, onUnmounted } = Vue;

      function getSafeRedirectTarget() {
        try {
          const params = new URLSearchParams(window.location.search);
          const raw = (params.get('redirect') || '').trim();
          if (
            raw &&
            raw.startsWith('/') &&
            !raw.startsWith('//') &&
            !raw.startsWith('/login') &&
            !raw.startsWith('/api/')
          ) {
            if (raw === '/' || raw === '/pages') return '/page';
            if (raw.startsWith('/pages?')) return '/page' + raw.slice(6);
            return raw;
          }
        } catch (e) {}
        return '/page';
      }

      function saveAuthBootstrap(user, csrfToken) {
        try {
          sessionStorage.setItem(
            'fb_reels_auth_bootstrap',
            JSON.stringify({
              user: user || null,
              csrf_token: csrfToken || null,
              ts: Date.now()
            })
          );
          localStorage.setItem(
            'fb_reels_auth_event',
            JSON.stringify({
              event: 'login',
              userId: user && user.id ? user.id : null,
              ts: Date.now()
            })
          );
        } catch (e) {}
      }

      createApp({
      setup() {
        const authState = ref('unauthenticated'); // 'checking' | 'authenticated' | 'unauthenticated'
        const activeTab = ref('login');
        const loading = ref(false);
        const errorMsg = ref('');
        const successMsg = ref('');

        const loginForm = ref({
          username: '',
          password: ''
        });

        async function verifyExistingSession() {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 6000);
          try {
            const resp = await fetch('/api/auth/me', {
              method: 'GET',
              credentials: 'same-origin',
              cache: 'no-store',
              signal: controller.signal
            });
            if (resp.ok) {
              const data = await resp.json();
              if (data && data.authenticated && data.user) {
                authState.value = 'authenticated';
                saveAuthBootstrap(data.user, data.csrf_token);
                window.location.replace(getSafeRedirectTarget());
                return true;
              }
            }
          } catch (e) {
            // Giữ trạng thái hiển thị form đăng nhập nếu chưa đăng nhập hoặc lỗi mạng
          } finally {
            clearTimeout(timer);
          }
          authState.value = 'unauthenticated';
          return false;
        }

        function onPageShow(event) {
          if (event && event.persisted) {
            authState.value = 'checking';
            verifyExistingSession();
          }
        }

        function onStorageEvent(event) {
          if (event && event.key === 'fb_reels_auth_event' && event.newValue) {
            try {
              const parsed = JSON.parse(event.newValue);
              if (parsed && parsed.event === 'login') {
                verifyExistingSession();
              }
            } catch (e) {}
          }
        }

        onMounted(() => {
          verifyExistingSession();
          window.addEventListener('pageshow', onPageShow);
          window.addEventListener('storage', onStorageEvent);
        });

        onUnmounted(() => {
          window.removeEventListener('pageshow', onPageShow);
          window.removeEventListener('storage', onStorageEvent);
        });

        const handleLogin = async () => {
          if (loading.value) return;
          errorMsg.value = '';
          successMsg.value = '';
          loading.value = true;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 12000);
          try {
            const resp = await fetch('/api/auth/login', {
              method: 'POST',
              credentials: 'same-origin',
              cache: 'no-store',
              signal: controller.signal,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: loginForm.value.username.trim(),
                password: loginForm.value.password
              })
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
              throw new Error(data.detail || data.message || 'Đăng nhập không thành công.');
            }
            authState.value = 'authenticated';
            saveAuthBootstrap(data.user, data.csrf_token);
            successMsg.value = 'Đăng nhập thành công! Đang chuyển đến trang quản lý...';
            window.location.replace(getSafeRedirectTarget());
          } catch (err) {
            if (err && err.name === 'AbortError') {
              errorMsg.value = 'Máy chủ phản hồi quá thời gian chờ. Vui lòng thử lại.';
            } else {
              errorMsg.value = err.message || 'Lỗi kết nối máy chủ.';
            }
          } finally {
            clearTimeout(timer);
            loading.value = false;
          }
        };

        return {
          authState,
          activeTab,
          loading,
          errorMsg,
          successMsg,
          loginForm,
          handleLogin
        };
      }
    }).mount('#app');
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLoginApp);
    } else {
      initLoginApp();
    }
  </script>
</body>
</html>
