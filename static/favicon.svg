<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="nnnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="26" fill="url(#nnnGrad)"/>
  <rect x="1" y="1" width="98" height="98" rx="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Reels Clapper Top Strip -->
  <path d="M25 18h50c2.2 0 4 1.8 4 4v4H21v-4c0-2.2 1.8-4 4-4z" fill="rgba(255,255,255,0.22)"/>
  <path d="M30 18l5 8h4l-5-8h-4zm14 0l5 8h4l-5-8h-4zm14 0l5 8h4l-5-8h-4z" fill="rgba(255,255,255,0.65)"/>

  <!-- Brand Typography NNN -->
  <text x="50" y="60" font-family="'Plus Jakarta Sans', 'Be Vietnam Pro', system-ui, -apple-system, sans-serif" font-weight="900" font-size="33" letter-spacing="-0.5" text-anchor="middle" fill="#ffffff" filter="url(#softGlow)">NNN</text>

  <!-- REELS FB Badge -->
  <rect x="20" y="69" width="60" height="16" rx="8" fill="rgba(255,255,255,0.22)"/>
  <text x="50" y="80.5" font-family="'Plus Jakarta Sans', 'Be Vietnam Pro', system-ui, -apple-system, sans-serif" font-weight="800" font-size="8" letter-spacing="1.2" text-anchor="middle" fill="#ffffff">REELS FB</text>
</svg>
